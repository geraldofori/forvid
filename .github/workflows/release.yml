name: Release

# Builds Forvid for macOS, Windows and Linux and attaches the installers
# to a draft GitHub Release. Cut a release by pushing a version tag:
#
#   git tag v0.1.0
#   git push origin v0.1.0
#
# The draft release appears at https://github.com/geraldofori/forvid/releases
# — review it, then publish.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # required to create releases and upload artifacts

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal macOS build that runs on Apple Silicon and Intel.
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
          # 22.04 for broad AppImage/deb compatibility (glibc floor).
          - platform: ubuntu-22.04
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Ensure macOS universal targets are installed
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare updater signing key
        id: signing-key
        shell: bash
        run: |
          set -e
          KEY_PATH="$HOME/.tauri/forvid.key"
          mkdir -p "$HOME/.tauri"
          printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" > "$KEY_PATH"
          # The Tauri CLI expects the private key env var/file to be a
          # base64-encoded minisign secret key (a single-line string).
          # Validate it with Python (base64 -d is inconsistent across runners).
          python3 - "$KEY_PATH" <<'PY'
          import base64, sys
          try:
              with open(sys.argv[1], 'r') as f:
                  data = f.read()
              decoded = base64.b64decode(data)
              if b'untrusted comment:' not in decoded.splitlines()[0]:
                  print('ERROR: secret does not decode to a minisign key')
                  sys.exit(1)
              print('Signing key validated OK')
          except Exception as e:
              print(f'ERROR: {e}')
              sys.exit(1)
          PY
          echo "path=$KEY_PATH" >> "$GITHUB_OUTPUT"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Build and create draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater bundles (required by the updater plugin) and
          # makes tauri-action generate latest.json on the release.
          # The private key lives ONLY in this repo's Actions secrets —
          # never in the repository. Public key is in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ steps.signing-key.outputs.path }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Forvid ${{ github.ref_name }}"
          releaseBody: "Download Forvid for your platform below, then follow the plain-language install steps in the [README](https://github.com/geraldofori/forvid#get-forvid-the-easy-way)."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }} --verbose
